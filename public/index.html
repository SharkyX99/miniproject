<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M PERFORMANCE | Bean Sprout Hydro-System (Cloud Control)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&family=Orbitron:wght@500;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --m-blue: #0166B1;
            --m-lightblue: #00A1E4;
            --m-violet: #6F2282;
            --m-red: #E7222E;
            --bg: #0a0a0c;
            --panel: #141417;
            --panel2: #1b1b20;
            --line: #2a2a30;
            --text: #f2f2f2;
            --muted: #8a8a92;
            --good: #00d16a;
            --warn: #ffb020;
            --font-body: 'Titillium Web', 'Segoe UI', Arial, sans-serif;
            --font-digital: 'Orbitron', 'Titillium Web', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% -10%, #1a1a1f 0%, var(--bg) 55%),
                repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 2px, transparent 2px, transparent 6px);
            color: var(--text);
            font-family: var(--font-body);
            min-height: 100vh;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        .m-stripe {
            height: 6px;
            width: 100%;
            background: linear-gradient(90deg, var(--m-blue) 0%, var(--m-lightblue) 33%, var(--m-violet) 66%, var(--m-red) 100%);
            box-shadow: 0 0 20px rgba(1, 102, 177, 0.6);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #101013, #0b0b0d);
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand .logo {
            font-family: var(--font-digital);
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue), var(--m-violet), var(--m-red));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .cluster-hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #131316, #0d0d10);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 26px;
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cluster-hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue), var(--m-violet), var(--m-red));
        }

        .cluster-hero .status-text {
            font-family: var(--font-digital);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--good);
        }

        .cluster-hero .big-clock {
            font-family: var(--font-digital);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 22px;
        }

        @media(max-width:650px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: linear-gradient(180deg, var(--panel), var(--panel2));
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue), var(--m-violet), var(--m-red));
            opacity: 0.85;
        }

        .card h3 {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .gauge-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            position: relative;
        }

        .gauge-value {
            text-align: center;
            position: absolute;
        }

        .gauge-value .num {
            font-family: var(--font-digital);
            font-size: 28px;
            font-weight: 700;
        }

        .gauge-value .unit {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        svg.gauge {
            overflow: visible;
        }

        .gauge-bg {
            fill: none;
            stroke: #26262c;
            stroke-width: 10;
        }

        .gauge-fg {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease;
        }

        .mode-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media(max-width:700px) {
            .mode-container {
                grid-template-columns: 1fr;
            }
        }

        .mode-btn {
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-digital);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .mode-btn:hover {
            border-color: var(--m-lightblue);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--m-blue), var(--m-lightblue));
            color: #fff;
            border-color: var(--m-lightblue);
            box-shadow: 0 0 15px rgba(0, 161, 228, 0.4);
        }

        .control-panel {
            background: linear-gradient(180deg, var(--panel), var(--panel2));
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 22px;
            position: relative;
        }

        .control-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue), var(--m-violet), var(--m-red));
        }

        .btn-water {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue));
            color: #fff;
            font-family: var(--font-digital);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 161, 228, 0.3);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-water:active {
            transform: scale(0.98);
        }

        .btn-water.stop {
            background: linear-gradient(90deg, var(--m-violet), var(--m-red));
            box-shadow: 0 4px 15px rgba(231, 34, 46, 0.3);
        }

        .chart-card {
            background: linear-gradient(180deg, var(--panel), var(--panel2));
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
        }

        .chart-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue), var(--m-violet), var(--m-red));
            opacity: 0.85;
        }

        .chart-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .chart-legend {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        .chart-legend span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .chart-legend .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .day-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .day-tab {
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 11px;
            letter-spacing: 1px;
            font-family: var(--font-digital);
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s;
        }

        .day-tab:hover {
            border-color: var(--m-lightblue);
            color: var(--text);
        }

        .day-tab.active {
            background: linear-gradient(135deg, var(--m-blue), var(--m-lightblue));
            color: #fff;
            border-color: var(--m-lightblue);
        }

        .btn-export {
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: var(--panel2);
            color: var(--text);
            font-family: var(--font-digital);
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-export:hover {
            border-color: var(--good);
            color: var(--good);
        }

        .btn-export:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .chart-wrap {
            position: relative;
            height: 260px;
        }

        .chart-empty {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--muted);
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            font-family: var(--font-digital);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>

<body>
    <div class="m-stripe"></div>
    <header>
        <div class="brand">
            <div class="logo">M PERFORMANCE</div>
            <small>CLOUD CONTROL SYSTEM</small>
        </div>
    </header>

    <main>
        <div class="cluster-hero">
            <div>
                <div class="status-text" id="sysStatus">CLOUD CONNECTED</div>
            </div>
            <div>
                <div class="big-clock" id="clusterClock">--:--:--</div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Sprout Temp (DHT11)</h3>
                <div class="gauge-wrap">
                    <svg class="gauge" width="130" height="130" viewBox="0 0 130 130">
                        <circle class="gauge-bg" cx="65" cy="65" r="52"></circle>
                        <circle class="gauge-fg" id="gaugeTemp" cx="65" cy="65" r="52" stroke="#00A1E4"
                            stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90 65 65)"></circle>
                    </svg>
                    <div class="gauge-value">
                        <div class="num" id="tempVal">--</div>
                        <div class="unit">°C</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Humidity</h3>
                <div class="gauge-wrap">
                    <svg class="gauge" width="130" height="130" viewBox="0 0 130 130">
                        <circle class="gauge-bg" cx="65" cy="65" r="52"></circle>
                        <circle class="gauge-fg" id="gaugeHum" cx="65" cy="65" r="52" stroke="#0166B1"
                            stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90 65 65)"></circle>
                    </svg>
                    <div class="gauge-value">
                        <div class="num" id="humVal">--</div>
                        <div class="unit">%RH</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="chart-card">
            <div class="chart-card-head">
                <h3 style="margin-bottom:0;">Temp / Humidity Trend</h3>
                <div class="chart-legend">
                    <span><i class="dot" style="background:#00A1E4;"></i>Temp (°C)</span>
                    <span><i class="dot" style="background:#0166B1;"></i>Humidity (%RH)</span>
                </div>
            </div>

            <div class="day-tabs" id="dayTabs"></div>

            <div class="chart-wrap">
                <canvas id="trendChart"></canvas>
                <div class="chart-empty" id="chartEmpty">LOADING HISTORY...</div>
            </div>

            <button class="btn-export" id="exportBtn" onclick="exportExcel()">
                EXPORT TO EXCEL (LAST 5 DAYS)
            </button>
        </div>

        <h3
            style="font-size:12px; letter-spacing:2px; color:var(--muted); margin-bottom:10px; text-transform:uppercase;">
            Select Operating Mode</h3>
        <div class="mode-container">
            <div class="mode-btn" id="btnMode0" onclick="setMode(0)">MANUAL MODE</div>
            <div class="mode-btn" id="btnMode1" onclick="setMode(1)">AUTO TIMER (EVERY 2H)</div>
            <div class="mode-btn" id="btnMode2" onclick="setMode(2)">AUTO TEMP SENSOR</div>
        </div>

        <div class="control-panel">
            <h3
                style="font-size:12px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:10px;">
                Solenoid Valve Control</h3>
            <button class="btn-water" id="actionBtn" onclick="toggleWatering()">START WATERING</button>

            <div class="info-bar">
                <span>VALVE STATE: <b id="valveText" style="color:var(--good);">CLOSED</b></span>
            </div>
        </div>
    </main>

    <script>
        const CIRC = 327;

        function updateGauge(id, val, max) {
            let pct = Math.min(Math.max(val / max, 0), 1);
            document.getElementById(id).style.strokeDashoffset = CIRC - (pct * CIRC);
        }

        function fetchData() {
            fetch('/api/status').then(r => r.json()).then(d => {
                document.getElementById('tempVal').innerText = Number(d.temp || 0).toFixed(1);
                document.getElementById('humVal').innerText = Number(d.hum || 0).toFixed(1);

                updateGauge('gaugeTemp', d.temp || 0, 50);
                updateGauge('gaugeHum', d.hum || 0, 100);

                [0, 1, 2].forEach(m => {
                    document.getElementById('btnMode' + m).className = (d.mode === m) ? "mode-btn active" : "mode-btn";
                });

                const actionBtn = document.getElementById('actionBtn');
                const valveText = document.getElementById('valveText');

                if (d.relay) {
                    actionBtn.innerText = "STOP WATERING";
                    actionBtn.className = "btn-water stop";
                    valveText.innerText = "OPEN (WATERING)";
                    valveText.style.color = "var(--m-lightblue)";
                } else {
                    actionBtn.innerText = "START WATERING";
                    actionBtn.className = "btn-water";
                    valveText.innerText = "CLOSED";
                    valveText.style.color = "var(--good)";
                }
            }).catch(e => console.log(e));
        }

        function setMode(mode) {
            fetch('/api/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'set_mode', mode: mode })
            }).then(() => fetchData());
        }

        function toggleWatering() {
            fetch('/api/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'toggle_watering' })
            }).then(() => fetchData());
        }

        setInterval(fetchData, 1500);

        setInterval(() => {
            const d = new Date();
            document.getElementById('clusterClock').innerText = d.toLocaleTimeString('th-TH');
        }, 1000);

        // =====================================================
        // TEMP / HUMIDITY TREND CHART
        // =====================================================

        const RETENTION_DAYS = 5;
        const SLOT_MINUTES = 30;
        const SLOTS_PER_DAY = (24 * 60) / SLOT_MINUTES; // 48

        let trendChart = null;
        let currentDate = null; // YYYY-MM-DD ที่กำลังดูอยู่ (เวลาไทย)

        // สร้าง label 48 ช่อง: 00:00, 00:30, ... 23:30
        function buildSlotLabels() {
            const labels = [];
            for (let i = 0; i < SLOTS_PER_DAY; i++) {
                const h = Math.floor(i * SLOT_MINUTES / 60);
                const m = (i * SLOT_MINUTES) % 60;
                labels.push(
                    String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0')
                );
            }
            return labels;
        }

        // วันที่ปัจจุบันตามเวลาไทย รูปแบบ YYYY-MM-DD
        function todayBangkokStr() {
            return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date());
        }

        // แปลง Date เป็นเวลาไทย {h, m} สำหรับหาว่าตกช่องไหน
        function bangkokHM(dateObj) {
            const parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false
            }).formatToParts(dateObj);
            const h = Number(parts.find(p => p.type === 'hour').value);
            const m = Number(parts.find(p => p.type === 'minute').value);
            return { h, m };
        }

        // เอา log ดิบมาใส่ลงช่อง 48 ช่อง (ช่องไหนไม่มีข้อมูล = null)
        // ถ้าเป็นวันนี้ และเวลายังไปไม่ถึงช่องนั้น ก็ปล่อยเป็น null
        // เหมือนกราฟหุ้นที่ตลาดยังไม่เปิดถึงช่วงนั้น
        function bucketizeDay(rows, dateStr) {
            const tempSlots = new Array(SLOTS_PER_DAY).fill(null);
            const humSlots = new Array(SLOTS_PER_DAY).fill(null);

            rows.forEach(r => {
                const d = new Date(r.recorded_at);
                const { h, m } = bangkokHM(d);
                const slotIndex = Math.floor((h * 60 + m) / SLOT_MINUTES);
                if (slotIndex >= 0 && slotIndex < SLOTS_PER_DAY) {
                    tempSlots[slotIndex] = Number(r.temperature);
                    humSlots[slotIndex] = Number(r.humidity);
                }
            });

            return { tempSlots, humSlots };
        }

        function buildChart(labels, tempData, humData) {
            const ctx = document.getElementById('trendChart').getContext('2d');

            if (trendChart) {
                trendChart.data.labels = labels;
                trendChart.data.datasets[0].data = tempData;
                trendChart.data.datasets[1].data = humData;
                trendChart.update();
                return;
            }

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Temp (°C)',
                            data: tempData,
                            borderColor: '#00A1E4',
                            backgroundColor: 'rgba(0,161,228,0.12)',
                            pointBackgroundColor: '#00A1E4',
                            yAxisID: 'yTemp',
                            tension: 0.3,
                            pointRadius: 3,
                            pointHoverRadius: 5,
                            borderWidth: 2,
                            spanGaps: false,
                            fill: true
                        },
                        {
                            label: 'Humidity (%RH)',
                            data: humData,
                            borderColor: '#0166B1',
                            backgroundColor: 'rgba(1,102,177,0.10)',
                            pointBackgroundColor: '#0166B1',
                            yAxisID: 'yHum',
                            tension: 0.3,
                            pointRadius: 3,
                            pointHoverRadius: 5,
                            borderWidth: 2,
                            spanGaps: false,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#8a8a92', maxTicksLimit: 8, font: { size: 10 } },
                            grid: { color: '#2a2a30' }
                        },
                        yTemp: {
                            position: 'left',
                            min: 15,
                            max: 45,
                            ticks: { color: '#00A1E4', font: { size: 10 } },
                            grid: { color: '#2a2a30' },
                            title: { display: true, text: '°C', color: '#8a8a92', font: { size: 10 } }
                        },
                        yHum: {
                            position: 'right',
                            ticks: { color: '#0166B1', font: { size: 10 } },
                            grid: { display: false },
                            title: { display: true, text: '%RH', color: '#8a8a92', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        // สร้างแท็บเลือกวัน (วันนี้ ย้อนหลังได้ 5 วัน)
        // ใช้ label แบบสัมพัทธ์ (TODAY, -1D, -2D...) ไม่ใช่วันที่ตายตัว
        // เพื่อไม่ต้องมาคอยแก้ทุกวัน
        function renderDayTabs() {
            const container = document.getElementById('dayTabs');
            container.innerHTML = '';

            for (let i = 0; i < RETENTION_DAYS; i++) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(d);

                const tab = document.createElement('div');
                tab.className = 'day-tab' + (dateStr === currentDate ? ' active' : '');
                tab.innerText = i === 0 ? 'TODAY' : ('-' + i + 'D');
                tab.title = dateStr; // hover ดูวันที่จริงได้
                tab.onclick = () => {
                    currentDate = dateStr;
                    renderDayTabs();
                    fetchHistory(dateStr);
                };
                container.appendChild(tab);
            }
        }

        function fetchHistory(dateStr) {
            const targetDate = dateStr || todayBangkokStr();
            currentDate = targetDate;

            fetch('/api/status?history=true&date=' + targetDate)
                .then(r => r.json())
                .then(d => {
                    const rows = d.history || [];
                    const emptyEl = document.getElementById('chartEmpty');

                    const labels = buildSlotLabels();
                    const { tempSlots, humSlots } = bucketizeDay(rows, targetDate);

                    emptyEl.style.display = rows.length === 0 ? 'flex' : 'none';
                    emptyEl.innerText = 'NO DATA FOR ' + targetDate;

                    buildChart(labels, tempSlots, humSlots);
                })
                .catch(e => console.log(e));
        }

        // =====================================================
        // EXPORT TO EXCEL (ย้อนหลังสูงสุด 5 วัน)
        // =====================================================

        async function exportExcel() {
            const btn = document.getElementById('exportBtn');
            btn.disabled = true;
            btn.innerText = 'EXPORTING...';

            try {
                const rowsOut = [];

                for (let i = 0; i < RETENTION_DAYS; i++) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const dateStr = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(d);

                    const res = await fetch('/api/status?history=true&date=' + dateStr);
                    const json = await res.json();
                    const rows = json.history || [];

                    rows.forEach(r => {
                        const localTime = new Date(r.recorded_at).toLocaleString('th-TH', {
                            timeZone: 'Asia/Bangkok',
                            year: 'numeric', month: '2-digit', day: '2-digit',
                            hour: '2-digit', minute: '2-digit', second: '2-digit'
                        });
                        rowsOut.push({
                            'Date': dateStr,
                            'Time (Bangkok)': localTime,
                            'Temperature (C)': r.temperature,
                            'Humidity (%RH)': r.humidity
                        });
                    });
                }

                if (rowsOut.length === 0) {
                    alert('ยังไม่มีข้อมูลให้ export');
                    return;
                }

                // เรียงจากเก่าไปใหม่
                rowsOut.reverse();

                const ws = XLSX.utils.json_to_sheet(rowsOut);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'Temp-Humidity Log');

                const fileDate = todayBangkokStr();
                XLSX.writeFile(wb, 'sprout-system-log-' + fileDate + '.xlsx');

            } catch (e) {
                console.error(e);
                alert('Export ไม่สำเร็จ: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'EXPORT TO EXCEL (LAST 5 DAYS)';
            }
        }

        renderDayTabs();
        fetchHistory(todayBangkokStr());
        setInterval(() => fetchHistory(currentDate), 60000); // รีเฟรชกราฟทุก 1 นาที
    </script>
</body>
