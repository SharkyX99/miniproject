<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M PERFORMANCE | Bean Sprout Hydro-System (Cloud Control)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&family=Orbitron:wght@500;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --m-blue: #0166B1;
            --m-lightblue: #00A1E4;
            --m-violet: #6F2282;
            --m-red: #E7222E;
            --bg: #0a0a0c;
            --panel: #141417;
            --panel2: #1b1b20;
            --line: #2a2a30;
            --text: #f2f2f2;
            --muted: #8a8a92;
            --good: #00d16a;
            --warn: #ffb020;
            --font-body: 'Titillium Web', 'Segoe UI', Arial, sans-serif;
            --font-digital: 'Orbitron', 'Titillium Web', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% -10%, #1a1a1f 0%, var(--bg) 55%),
                repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.015) 0px, rgba(255, 255, 255, 0.015) 2px, transparent 2px, transparent 6px);
            color: var(--text);
            font-family: var(--font-body);
            min-height: 100vh;
            padding-bottom: 40px;
            overflow-x: hidden;
        }

        .m-stripe {
            height: 6px;
            width: 100%;
            background: linear-gradient(90deg, var(--m-blue) 0%, var(--m-lightblue) 33%, var(--m-violet) 66%, var(--m-red) 100%);
            box-shadow: 0 0 20px rgba(1, 102, 177, 0.6);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 28px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, #101013, #0b0b0d);
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand .logo {
            font-family: var(--font-digital);
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue), var(--m-violet), var(--m-red));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 3px;
            font-weight: 600;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }

        .cluster-hero {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #131316, #0d0d10);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 26px;
            margin-bottom: 22px;
            position: relative;
            overflow: hidden;
            flex-wrap: wrap;
            gap: 10px;
        }

        .cluster-hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue), var(--m-violet), var(--m-red));
        }

        .cluster-hero .status-text {
            font-family: var(--font-digital);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--good);
        }

        .cluster-hero .big-clock {
            font-family: var(--font-digital);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-bottom: 22px;
        }

        @media(max-width:650px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: linear-gradient(180deg, var(--panel), var(--panel2));
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue), var(--m-violet), var(--m-red));
            opacity: 0.85;
        }

        .card h3 {
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .gauge-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            position: relative;
        }

        .gauge-value {
            text-align: center;
            position: absolute;
        }

        .gauge-value .num {
            font-family: var(--font-digital);
            font-size: 28px;
            font-weight: 700;
        }

        .gauge-value .unit {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 1px;
        }

        svg.gauge {
            overflow: visible;
        }

        .gauge-bg {
            fill: none;
            stroke: #26262c;
            stroke-width: 10;
        }

        .gauge-fg {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.4s ease;
        }

        .mode-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        @media(max-width:700px) {
            .mode-container {
                grid-template-columns: 1fr;
            }
        }

        .mode-btn {
            background: var(--panel2);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-family: var(--font-digital);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .mode-btn:hover {
            border-color: var(--m-lightblue);
        }

        .mode-btn.active {
            background: linear-gradient(135deg, var(--m-blue), var(--m-lightblue));
            color: #fff;
            border-color: var(--m-lightblue);
            box-shadow: 0 0 15px rgba(0, 161, 228, 0.4);
        }

        .control-panel {
            background: linear-gradient(180deg, var(--panel), var(--panel2));
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 22px;
            position: relative;
        }

        .control-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue), var(--m-violet), var(--m-red));
        }

        .btn-water {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, var(--m-blue), var(--m-lightblue));
            color: #fff;
            font-family: var(--font-digital);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 161, 228, 0.3);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-water:active {
            transform: scale(0.98);
        }

        .btn-water.stop {
            background: linear-gradient(90deg, var(--m-violet), var(--m-red));
            box-shadow: 0 4px 15px rgba(231, 34, 46, 0.3);
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--muted);
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid var(--line);
            font-family: var(--font-digital);
        }
    </style>
</head>

<body>
    <div class="m-stripe"></div>
    <header>
        <div class="brand">
            <div class="logo">M PERFORMANCE</div>
            <small>CLOUD CONTROL SYSTEM</small>
        </div>
    </header>

    <main>
        <div class="cluster-hero">
            <div>
                <div class="status-text" id="sysStatus">CLOUD CONNECTED</div>
            </div>
            <div>
                <div class="big-clock" id="clusterClock">--:--:--</div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Sprout Temp (DHT11)</h3>
                <div class="gauge-wrap">
                    <svg class="gauge" width="130" height="130" viewBox="0 0 130 130">
                        <circle class="gauge-bg" cx="65" cy="65" r="52"></circle>
                        <circle class="gauge-fg" id="gaugeTemp" cx="65" cy="65" r="52" stroke="#00A1E4"
                            stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90 65 65)"></circle>
                    </svg>
                    <div class="gauge-value">
                        <div class="num" id="tempVal">--</div>
                        <div class="unit">°C</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>Humidity</h3>
                <div class="gauge-wrap">
                    <svg class="gauge" width="130" height="130" viewBox="0 0 130 130">
                        <circle class="gauge-bg" cx="65" cy="65" r="52"></circle>
                        <circle class="gauge-fg" id="gaugeHum" cx="65" cy="65" r="52" stroke="#0166B1"
                            stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90 65 65)"></circle>
                    </svg>
                    <div class="gauge-value">
                        <div class="num" id="humVal">--</div>
                        <div class="unit">%RH</div>
                    </div>
                </div>
            </div>
        </div>

        <h3
            style="font-size:12px; letter-spacing:2px; color:var(--muted); margin-bottom:10px; text-transform:uppercase;">
            Select Operating Mode</h3>
        <div class="mode-container">
            <div class="mode-btn" id="btnMode0" onclick="setMode(0)">MANUAL MODE</div>
            <div class="mode-btn" id="btnMode1" onclick="setMode(1)">AUTO TIMER (EVERY 2H)</div>
            <div class="mode-btn" id="btnMode2" onclick="setMode(2)">AUTO TEMP SENSOR</div>
        </div>

        <div class="control-panel">
            <h3
                style="font-size:12px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-bottom:10px;">
                Solenoid Valve Control</h3>
            <button class="btn-water" id="actionBtn" onclick="toggleWatering()">START WATERING</button>

            <div class="info-bar">
                <span>VALVE STATE: <b id="valveText" style="color:var(--good);">CLOSED</b></span>
            </div>
        </div>
    </main>

    <script>
        const CIRC = 327;

        function updateGauge(id, val, max) {
            let pct = Math.min(Math.max(val / max, 0), 1);
            document.getElementById(id).style.strokeDashoffset = CIRC - (pct * CIRC);
        }

        function fetchData() {
            fetch('/api/status').then(r => r.json()).then(d => {
                document.getElementById('tempVal').innerText = Number(d.temp || 0).toFixed(1);
                document.getElementById('humVal').innerText = Number(d.hum || 0).toFixed(1);

                updateGauge('gaugeTemp', d.temp || 0, 50);
                updateGauge('gaugeHum', d.hum || 0, 100);

                [0, 1, 2].forEach(m => {
                    document.getElementById('btnMode' + m).className = (d.mode === m) ? "mode-btn active" : "mode-btn";
                });

                const actionBtn = document.getElementById('actionBtn');
                const valveText = document.getElementById('valveText');

                if (d.relay) {
                    actionBtn.innerText = "STOP WATERING";
                    actionBtn.className = "btn-water stop";
                    valveText.innerText = "OPEN (WATERING)";
                    valveText.style.color = "var(--m-lightblue)";
                } else {
                    actionBtn.innerText = "START WATERING";
                    actionBtn.className = "btn-water";
                    valveText.innerText = "CLOSED";
                    valveText.style.color = "var(--good)";
                }
            }).catch(e => console.log(e));
        }

        function setMode(mode) {
            fetch('/api/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'set_mode', mode: mode })
            }).then(() => fetchData());
        }

        function toggleWatering() {
            fetch('/api/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'toggle_watering' })
            }).then(() => fetchData());
        }

        setInterval(fetchData, 1500);

        setInterval(() => {
            const d = new Date();
            document.getElementById('clusterClock').innerText = d.toLocaleTimeString('th-TH');
        }, 1000);
    </script>
</body>

</html>
